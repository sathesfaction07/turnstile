name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,agent]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test, including the attack suite over real HTTP
        run: pytest -q --cov=turnstile --cov-report=term-missing --cov-fail-under=85

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,agent]"
      - name: Test
        shell: bash
        run: pytest -q

  apigee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: apigeelint
        run: npx --yes apigeelint@2 -s apigee/apiproxy -f table.js --profile apigeex

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate (never applied)
        run: |
          terraform init -backend=false -input=false
          terraform validate
