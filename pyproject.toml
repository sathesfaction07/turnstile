[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnstile"
version = "0.1.0"
description = "An MCP gateway that lets AI agents use a legacy policy system safely: identity, scopes, redaction, confirmed writes, audit."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
agent = ["google-adk>=2.15"]

[project.scripts]
turnstile = "turnstile.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile"]
